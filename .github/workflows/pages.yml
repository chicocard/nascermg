# Publica app/public no GitHub Pages a cada push na branch main.
# Uma vez: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
name: publicar-app
on:
  push:
    branches: [main]
    paths: ["app/public/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/public
      - id: deploy
        uses: actions/deploy-pages@v4
