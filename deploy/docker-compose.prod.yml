# Publicação do app numa máquina virtual Linux com Docker (Caddy serve app/public com HTTPS automático).
# Na VM:  DOMINIO=nascer.exemplo.org docker compose -f deploy/docker-compose.prod.yml up -d
# Só as portas 80 e 443 ficam expostas; nenhum container do pipeline (dados, warehouse, .env) é publicado.
name: nascer-prod
services:
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMINIO: ${DOMINIO:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../app/public:/srv:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  caddy_data: {}
  caddy_config: {}
